name: Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:      # Allows manual trigger

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Generate Coding Habits metrics
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.habits.svg
          base: ""                     # Hides default header to isolate habits
          
          # Enable Coding Habits plugin
          plugin_habits: yes
          plugin_habits_facts: yes     # Displays facts (e.g., indent style, avg line length)
          plugin_habits_charts: yes    # Displays commit activity charts by hour/day
          plugin_habits_days: 14       # Days back to analyze events (1-30)
          plugin_habits_from: 200      # Recent events to analyze (up to 1000)
          config_timezone: Europe/Paris # Set your timezone for accurate active hours

      # Step 2: Generate Achievements metrics
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.achievements.svg
          base: ""                     # Hides default header to isolate achievements
          
          # Enable Achievements plugin
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: A
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 5